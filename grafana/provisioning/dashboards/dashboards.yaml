# 用途：告诉 Grafana 从仓库目录加载看板 JSON
# 对应文档：docs/07-操作步骤.md 阶段 8
apiVersion: 1

providers:
  - name: ecommerce-realtime-dw
    orgId: 1
    folder: 电商实时数仓
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /mnt/d/projects/ecommerce-realtime-dw/grafana/dashboards
      foldersFromFilesStructure: false
