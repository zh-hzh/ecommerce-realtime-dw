# 用途：本机 Grafana 启动配置（OSS 11.3.0，tar 包安装）
# 对应文档：docs/07-操作步骤.md 阶段 8
# 说明：
#   1. 只覆盖必要项，其余用 Grafana 默认值；数据目录默认落在安装目录 data/ 下。
#   2. provisioning 指向仓库内 grafana/provisioning，改看板/数据源只需改仓库文件再重启。
#   3. 本机演示环境，admin 口令为 admin；外网暴露前必须改。

[server]
http_addr = 0.0.0.0
http_port = 3000
domain = localhost
root_url = http://localhost:3000/

[paths]
provisioning = /mnt/d/projects/ecommerce-realtime-dw/grafana/provisioning

[security]
admin_user = admin
admin_password = admin
# 本机演示不接 SSO
disable_initial_admin_creation = false

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false

[log]
mode = console file
level = info
